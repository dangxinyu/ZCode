<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Don’t-think</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        height: 100%;
      }

      #root {
        opacity: 0;
        transition: opacity 0.16s ease;
      }

      body.zcode-startup-ready #root {
        opacity: 1;
      }

      #loading {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.16s ease;
      }

      body.zcode-startup-ready #loading {
        pointer-events: none;
        opacity: 0;
      }

      .startup-logo-shell {
        position: relative;
        display: flex;
        width: 96px;
        height: 96px;
        align-items: center;
        justify-content: center;
        border-radius: 24px;
        background: linear-gradient(180deg, #000000 0%, #151718 100%);
        box-shadow:
          0 20px 25px -5px rgb(0 0 0 / 0.2),
          0 8px 10px -6px rgb(0 0 0 / 0.2);
        transform: scale(0.72);
        opacity: 0;
        animation: startup-logo-pop 0.72s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        transform-origin: center;
      }

      .startup-logo-shell::before {
        position: absolute;
        inset: 0;
        pointer-events: none;
        content: "";
        /* 启动 logo 壳是固定深色底，边框不能跟随浅色主题 token，否则首屏边框过重。*/
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: inherit;
      }

      .startup-logo {
        width: 56px;
        height: auto;
        color: #ffffff;
      }

      @keyframes startup-logo-pop {
        0% {
          opacity: 0;
          transform: scale(0.72);
        }

        38% {
          opacity: 1;
          transform: scale(1.045);
        }

        58% {
          transform: scale(0.985);
        }

        76% {
          transform: scale(1.008);
        }

        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .startup-logo-shell {
          opacity: 1;
          transform: scale(1);
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div
      id="loading"
      class="[app-region:drag]"
      role="status"
      aria-busy="true"
      aria-label="Loading..."
    >
      <div class="startup-logo-shell">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="118"
          height="100"
          fill="none"
          viewBox="0 0 256 218"
          class="startup-logo"
          aria-hidden="true"
        ><path fill="currentColor" d="M54.87593375601857 0.0H154.95369637539102Q184.54578368780574 0.0 200.75991107561615 8.030013642564796Q216.97403846342655 16.060027285129593 225.12567286547215 31.07912687585265Q233.27730726751776 46.09822646657571 233.66245759558393 66.02455661664392Q234.0476079236501 85.95088676671213 228.48619885613851 108.25648021828104Q219.77332465037034 143.2019099590723 207.01631315769242 162.45907230559345Q194.2593016650145 181.7162346521146 176.88827052297242 194.72783083219645Q159.51723938093033 207.7394270122783 142.23330238640472 212.0518417462483Q118.5933704731765 218.0 100.6001917555776 218.0H0.5224291362051616ZM109.92957391033094 49.36971350613916 80.23164948981898 168.48158253751706H96.73778864397997Q117.85375044479851 168.48158253751706 127.9438837296035 163.7974079126876Q138.0340170144085 159.11323328785812 146.00042227542852 147.4399727148704Q153.96682753644853 135.7667121418827 160.49221417566218 109.59481582537518Q169.13093626053018 74.9467939972715 161.0179767771086 62.15825375170533Q152.90501729368702 49.36971350613916 126.7331209771795 49.36971350613916Z" />
        </svg>
      </div>
    </div>
    <script type="module">
      const startupLogoShell = document.querySelector(".startup-logo-shell");
      const startupLoading = document.getElementById("loading");
      const isUpdateStatusWindow =
        new URLSearchParams(window.location.search).get("windowKind") === "update-status";
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let finished = false;
      let animationDone = false;
      let reactReady = false;

      // 主入口不能依赖动画结束后的动态 import；一旦导入路径在 Electron/Vite 下失败，
      // 页面会永久停在 HTML loading。这里让主入口静态加载，只把启动壳作为动画遮罩延迟移除。
      const tryFinishStartupAnimation = () => {
        if (finished || !animationDone || !reactReady) return;
        finished = true;
        document.body.classList.add("zcode-startup-ready");
        window.setTimeout(() => startupLoading?.remove(), 500);
      };

      const markAnimationDone = () => {
        animationDone = true;
        tryFinishStartupAnimation();
      };

      const markReactReady = () => {
        reactReady = true;
        tryFinishStartupAnimation();
      };

      if (isUpdateStatusWindow) {
        // 更新状态窗口本身就是一个轻量弹窗，复用主入口 HTML 时不应再显示启动壳。
        // 否则透明独立窗口里的启动 logo 会短暂或持续盖在更新按钮上，看起来像弹窗 UI 异常。
        finished = true;
        document.body.classList.add("zcode-startup-ready");
        startupLoading?.remove();
      } else {
        window.addEventListener("zcode-react-startup-ready", markReactReady, { once: true });
      }

      if (isUpdateStatusWindow || reduceMotion || !startupLogoShell) {
        markAnimationDone();
      } else {
        startupLogoShell.addEventListener("animationend", markAnimationDone, { once: true });
        window.setTimeout(markAnimationDone, 1000);
      }

      if (!isUpdateStatusWindow) {
        window.setTimeout(markReactReady, 3000);
      }
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
